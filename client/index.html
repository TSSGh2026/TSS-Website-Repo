<!DOCTYPE html>

    <meta charset="UTF-8" />
    <!-- No maximum-scale. Locking zoom is a WCAG 1.4.4 failure, Android honours
         it, and nothing on this site needs it: the acts are sized in svh and
         vw and survive being pinched. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="2ppqBQzMnlXhVqby40vMD4HYJSxraZDexbcZQiQJAE4" />

    <link rel="canonical" href="https://www.storyshaperscollective.com/" />

    <meta property="og:title" content="The Story Shapers | Editorial-Led Brand Strategy & Growth" />
    <meta property="og:description" content="A senior marketing collective for growing brands: editorial-grade content strategy, brand positioning, go-to-market, SEO/AEO and growth marketing." />

    <meta property="og:url" content="https://www.storyshaperscollective.com/" />
    <meta property="og:site_name" content="The Story Shapers" />
    <!-- ?v= is a cache-buster, not decoration. Every social platform caches an
         unfurl by URL and keeps serving the old picture for weeks after the
         file behind it changes. Bump the date whenever script/og-home.html is
         re-rendered, or the card people see stays the previous hero's. -->
    <meta property="og:image" content="https://www.storyshaperscollective.com/opengraph.jpg?v=2026-08-25" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Story Shapers | Editorial-Led Brand Strategy & Growth" />
    <meta name="twitter:description" content="A senior marketing collective for growing brands: editorial-grade content strategy, brand positioning, go-to-market, SEO/AEO and growth marketing." />
    <meta name="twitter:image" content="https://www.storyshaperscollective.com/opengraph.jpg?v=2026-08-25" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The Story Shapers",
      "alternateName": "The Story Shapers Collective",
      "url": "https://www.storyshaperscollective.com/",
      "logo": "https://www.storyshaperscollective.com/favicon.png",
      "image": "https://www.storyshaperscollective.com/opengraph.jpg?v=2026-08-25",
      "description": "The Story Shapers is a senior marketing collective for growing brands: editorial-grade content strategy, brand positioning, go-to-market, SEO/AEO and growth marketing. India-based, working globally.",
      "founder": [
        { "@type": "Person", "name": "Fatema Hanif" },
        { "@type": "Person", "name": "Shaili Contractor" },
        { "@type": "Person", "name": "Aakanksha Singh Devi" }
      ],
      "sameAs": [
        "https://www.linkedin.com/company/the-story-shapers-collective",
        "https://instagram.com/thestoryshapers"
      ],
      "address": { "@type": "PostalAddress", "addressCountry": "IN" },
      "areaServed": "Worldwide"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Zodiak and Switzer are self-hosted; the @font-face rules live in
         index.css and the files in /public/fonts. The first screen renders six
         of the seven weights (measured, 9 Sep: Switzer 400/500/600, Zodiak 400
         + 700 + 700 italic), and `font-display: block` keeps text invisible
         until each one lands — so all six are critical-path and preloaded here,
         ahead of the JS bundle they would otherwise queue behind. Only
         zodiak-400-italic waits until something needs it. -->
    <link rel="preload" href="/fonts/zodiak-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/zodiak-700-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/zodiak-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/switzer-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/switzer-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/switzer-600-normal.woff2" as="font" type="font/woff2" crossorigin>

    <script>
      // Campaign analytics. IDs arrive when Meta Business Manager is set up;
      // both blocks are inert while the IDs are empty strings.
      window.__TSS_META_PIXEL_ID = "";
      window.__TSS_GTM_ID = "";
      (function () {
        var pixelId = window.__TSS_META_PIXEL_ID;
        if (pixelId) {
          !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n;
            n.loaded = !0;
            n.version = "2.0";
            n.queue = [];
            t = b.createElement(e);
            t.async = !0;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
          window.fbq("init", pixelId);
          window.fbq("track", "PageView");
        }
        var gtmId = window.__TSS_GTM_ID;
        if (gtmId) {
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", gtmId);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
